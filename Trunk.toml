# Trunk のエントリ HTML を src-web クレートに固定。
# 開発時は `trunk serve` をワークスペースルートで実行する。
[build]
target = "crates/src-web/index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[watch]
ignore = ["SRC_20121125", "dist", "target"]

# 開発・検証用: `/fixtures/` をテスト用フィクスチャ (crates/src-web/tests/fixtures、
# 再配布不可のため .gitignore 済み) を配る静的サーバへ中継する。`dist/` には複製しない。
# 静的サーバは `just fixtures` (127.0.0.1:8090) で起動し、`?load=fixtures/<名前>.zip` で読み込む。
[[proxy]]
rewrite = "/fixtures/"
backend = "http://127.0.0.1:8090/"
